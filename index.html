<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="김준성의 개인 소개 페이지" />
    <title>김준성 | Profile</title>
    <style>
      :root {
        --ink: #18212f;
        --muted: #617083;
        --line: #e6eaf0;
        --accent: #2457d6;
        --accent-soft: #eef3ff;
        --surface: #ffffff;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        color: var(--ink);
        background: #f7f9fc;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      .wrap {
        width: min(100% - 40px, 860px);
        margin: 0 auto;
      }

      header {
        padding: 72px 0 48px;
        background: linear-gradient(135deg, #eff4ff 0%, #ffffff 68%);
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        color: var(--accent);
        font-size: 0.83rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1, h2, p { margin-top: 0; }

      h1 {
        margin-bottom: 12px;
        font-size: clamp(2.25rem, 7vw, 4.2rem);
        line-height: 1.15;
        letter-spacing: -0.055em;
      }

      .subtitle {
        max-width: 540px;
        margin-bottom: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.18rem);
      }

      main { padding: 42px 0 72px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      section {
        padding: 28px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(29, 48, 82, 0.04);
      }

      section:first-child { grid-column: 1 / -1; }

      h2 {
        margin-bottom: 14px;
        font-size: 1.08rem;
        letter-spacing: -0.02em;
      }

      section p { margin-bottom: 0; color: var(--muted); }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .tags li {
        padding: 7px 12px;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        font-size: 0.92rem;
        font-weight: 600;
      }

      .contact-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      .contact-link:hover { text-decoration: underline; }

      footer {
        padding: 24px 0 36px;
        color: var(--muted);
        font-size: 0.88rem;
        text-align: center;
      }

      @media (max-width: 600px) {
        .wrap { width: min(100% - 32px, 860px); }
        header { padding: 56px 0 36px; }
        main { padding: 28px 0 48px; }
        .grid { grid-template-columns: 1fr; gap: 14px; }
        section { padding: 22px; border-radius: 15px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <span class="eyebrow">PERSONAL PROFILE</span>
        <h1>김준성</h1>
        <p class="subtitle">서울대학교 첨단융합학부 재학 중</p>
      </div>
    </header>

    <main class="wrap">
      <div class="grid">
        <section id="about">
          <h2>소개</h2>
          <p>
            새로운 기술과 다양한 분야의 연결에 관심을 두고 배우고 있습니다.
            배운 것을 직접 만들어 보며 꾸준히 성장하고 있습니다.
          </p>
        </section>

        <section id="interests">
          <h2>관심사</h2>
          <ul class="tags">
            <li>프로그래밍</li>
            <li>인공지능</li>
            <li>융합 기술</li>
            <li>문제 해결</li>
          </ul>
        </section>

        <section id="contact">
          <h2>연락처</h2>
          <a class="contact-link" href="mailto:your-email@example.com">
            이메일 보내기 →
          </a>
          <p style="margin-top: 8px; font-size: 0.9rem;">
            이메일 주소는 원하는 주소로 바꿔 주세요.
          </p>
        </section>
      </div>
    </main>

    <footer>
      © 2026 김준성. All rights reserved.
    </footer>
  </body>
</html>
